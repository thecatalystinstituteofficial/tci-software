<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>TCI | Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
        :root {
            --red: #d62828;
            --yel: #ffc300;
            --bg: #f4f2ed;
            --card: #fff;
            --ink: #141414;
            --mut: #666;
            --line: #e2ded3;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0e0e0e;
                --card: #1a1a1a;
                --ink: #f2f2f2;
                --mut: #a5a5a5;
                --line: #333
            }
        }

        :root[data-theme="dark"] {
            --bg: #0e0e0e;
            --card: #1a1a1a;
            --ink: #f2f2f2;
            --mut: #a5a5a5;
            --line: #333
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            font: 14px/1.45 "Segoe UI", system-ui, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            display: flex;
            min-height: 100vh
        }

        aside {
            width: 240px;
            background: #0a0a0a;
            color: #fff;
            padding: 20px 12px;
            position: sticky;
            top: 0;
            height: 100vh;
            flex-shrink: 0;
            border-right: 4px solid var(--red)
        }

        .logo {
            font-weight: 800;
            font-size: 18px;
            line-height: 1.2;
            letter-spacing: .5px;
            padding: 4px 10px 20px;
            color: var(--yel);
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 12px
        }

        .logo small {
            display: block;
            color: #bbb;
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 0;
            margin-top: 6px
        }

        nav button {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: 0;
            border-left: 3px solid transparent;
            color: #d8d8d8;
            padding: 11px 12px;
            margin: 2px 0;
            font: inherit;
            cursor: pointer
        }

        nav button:hover {
            background: #1c1c1c
        }

        nav button.on {
            border-left-color: var(--yel);
            background: #1f1f1f;
            color: #fff;
            font-weight: 700
        }

        .mw {
            flex: 1;
            min-width: 0
        }

        main {
            padding: 24px
        }

        .mbar {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--card);
            border-bottom: 3px solid var(--yel);
            padding: 10px 24px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .mbar input {
            width: auto;
            padding: 6px 8px
        }

        .mbar b {
            margin-right: 4px
        }

        .mbar .hint {
            color: var(--mut);
            font-size: 12px;
            margin-left: auto
        }

        h2 {
            margin: 0 0 16px;
            font-size: 22px;
            border-left: 6px solid var(--yel);
            padding-left: 10px
        }

        h2 small {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: var(--mut)
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px
        }

        .card h3 {
            margin: 0 0 10px;
            font-size: 15px
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 16px
        }

        .st {
            background: var(--card);
            border: 1px solid var(--line);
            border-top: 4px solid var(--red);
            border-radius: 8px;
            padding: 14px
        }

        .st:nth-child(even) {
            border-top-color: var(--yel)
        }

        .st b {
            display: block;
            font-size: 22px
        }

        .st span {
            color: var(--mut);
            font-size: 12px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 12px
        }

        label {
            font-size: 12px;
            color: var(--mut);
            display: block;
            margin-bottom: 3px
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg);
            color: var(--ink);
            font: inherit
        }

        input[type=radio],
        input[type=checkbox] {
            width: auto
        }

        input:focus,
        select:focus,
        textarea:focus,
        button:focus-visible {
            outline: 2px solid var(--yel);
            outline-offset: 1px
        }

        .btn {
            background: var(--red);
            color: #fff;
            border: 0;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font: inherit;
            font-weight: 600
        }

        .btn.y {
            background: var(--yel);
            color: #111
        }

        .btn.k {
            background: #111;
            color: #fff
        }

        .btn.s {
            padding: 5px 10px;
            font-size: 12px
        }

        .btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 14px
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            border-bottom: 2px solid var(--line)
        }

        .tabs button {
            background: none;
            border: 0;
            padding: 10px 18px;
            font: inherit;
            cursor: pointer;
            color: var(--mut);
            border-bottom: 3px solid transparent;
            margin-bottom: -2px
        }

        .tabs button.on {
            color: var(--ink);
            font-weight: 700;
            border-bottom-color: var(--red)
        }

        .tw {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th {
            background: #111;
            color: var(--yel);
            text-align: left;
            padding: 9px;
            font-size: 12px;
            white-space: nowrap
        }

        td {
            padding: 9px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap
        }

        .tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 700
        }

        .ok {
            background: var(--yel);
            color: #111
        }

        .no {
            background: var(--red);
            color: #fff
        }

        .lv {
            background: #111;
            color: #fff
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: end;
            margin-bottom: 12px
        }

        .row>div {
            flex: 1;
            min-width: 150px
        }

        .row>.btn {
            flex: 0
        }

        .ck {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            margin: 4px 12px 4px 0;
            color: var(--ink);
            font-size: 13px
        }

        #modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .72);
            display: none;
            align-items: flex-start;
            justify-content: center;
            z-index: 9;
            padding: 20px 12px;
            overflow: auto
        }

        #mbox {
            background: #fff;
            color: #111;
            border-radius: 10px;
            padding: 18px;
            max-width: 100%
        }

        .po,
        #pz {
            display: none
        }

        .idc {
            width: 330px;
            border: 2px solid #111;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            color: #111;
            margin: auto
        }

        .idc .h {
            background: #111;
            color: var(--yel);
            text-align: center;
            padding: 12px;
            font-weight: 800;
            font-size: 16px;
            border-bottom: 5px solid var(--red)
        }

        .idc .h small {
            display: block;
            font-weight: 400;
            font-size: 10px;
            color: #fff;
            letter-spacing: 1px;
            margin-top: 2px
        }

        .idc .b {
            padding: 14px;
            display: flex;
            gap: 12px
        }

        .phb {
            width: 90px;
            height: 110px;
            border: 2px solid #111;
            border-radius: 6px;
            background: #111;
            color: var(--yel);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 800;
            overflow: hidden;
            flex-shrink: 0
        }

        .phb img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .idc p {
            margin: 3px 0;
            font-size: 12px
        }

        .idc .f {
            background: var(--red);
            color: #fff;
            text-align: center;
            padding: 7px;
            font-weight: 700;
            letter-spacing: 2px
        }

        .rc {
            width: 72mm;
            margin: 0 auto;
            background: #fff;
            color: #000;
            font: 12px/1.4 "Courier New", Courier, monospace
        }

        .rc h3 {
            text-align: center;
            margin: 0 0 2px;
            color: #000;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase
        }

        .rc hr {
            border: 0;
            border-top: 1px dashed #000;
            margin: 6px 0
        }

        .rc hr.d {
            border-top: 3px double #000
        }

        .rc table {
            width: 100%;
            border-collapse: collapse
        }

        .rc td {
            border: 0;
            padding: 2px 0;
            white-space: normal;
            vertical-align: top;
            color: #000
        }

        .rc td:last-child {
            text-align: right;
            padding-left: 6px
        }

        .rc .c {
            text-align: center
        }

        .rc .sm {
            font-size: 10px
        }

        .rc .tt td {
            font-size: 15px;
            font-weight: 700
        }

        .rc .ttl {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px
        }

        .rc .stamp {
            display: inline-block;
            border: 2px solid #000;
            padding: 2px 16px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 4px
        }

        .rc .sig {
            width: 60%;
            margin: 26px auto 0;
            border-top: 1px solid #000;
            text-align: center;
            font-size: 10px;
            padding-top: 2px
        }

        .rpt {
            background: #fff;
            color: #111;
            max-width: 790px;
            margin: 0 auto;
            border: 1px solid #ccc;
            font-size: 12.5px;
            --line: #ddd
        }

        .rpt .rh {
            background: #111;
            color: #fff;
            padding: 18px 24px;
            border-bottom: 6px solid var(--red);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px
        }

        .rpt .rh h1 {
            margin: 0;
            font-size: 21px;
            letter-spacing: 1px;
            color: var(--yel)
        }

        .rpt .rh small {
            display: block;
            color: #ccc;
            font-size: 11px
        }

        .rpt .rh div:last-child {
            text-align: right
        }

        .rpt .bd {
            padding: 6px 24px 22px
        }

        .rpt h4 {
            margin: 18px 0 8px;
            border-left: 5px solid var(--yel);
            padding-left: 8px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .rpt td {
            border-bottom: 1px solid #ddd;
            padding: 6px 8px
        }

        .rpt th {
            padding: 7px 8px
        }

        .meta {
            display: flex;
            gap: 16px;
            align-items: flex-start
        }

        .kv {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 18px;
            flex: 1
        }

        .kv span {
            display: block;
            color: #666;
            font-size: 11px
        }

        .bar {
            height: 10px;
            background: #e8e8e8;
            border-radius: 5px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--red)
        }

        .sum {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px
        }

        .sum div {
            border: 1px solid #ddd;
            border-top: 3px solid var(--yel);
            padding: 8px;
            text-align: center
        }

        .sum b {
            display: block;
            font-size: 18px
        }

        .sum span {
            font-size: 11px;
            color: #666
        }

        .sg {
            display: flex;
            gap: 30px;
            margin-top: 46px
        }

        .sg div {
            flex: 1;
            border-top: 1px solid #111;
            text-align: center;
            padding-top: 4px;
            font-size: 11px
        }

        .ft {
            text-align: center;
            color: #777;
            font-size: 10px;
            margin-top: 16px
        }

        @media(max-width:760px) {
            body {
                display: block
            }

            aside {
                width: 100%;
                height: auto;
                position: static;
                border-right: 0;
                border-bottom: 4px solid var(--red)
            }

            nav {
                display: flex;
                overflow-x: auto
            }

            nav button {
                width: auto;
                white-space: nowrap;
                border-left: 0;
                border-bottom: 3px solid transparent
            }

            nav button.on {
                border-bottom-color: var(--yel)
            }

            main {
                padding: 14px
            }

            .meta {
                flex-direction: column
            }
        }

        .rpt {
            font-size: 12px
        }

        .rpt .rh {
            padding: 12px 20px
        }

        .rpt .rh h1 {
            font-size: 19px
        }

        .rpt .bd {
            padding: 2px 20px 14px
        }

        .rpt h4 {
            margin: 12px 0 6px
        }

        .rpt td {
            padding: 4px 6px
        }

        .rpt th {
            padding: 5px 6px
        }

        .rpt .sum {
            gap: 6px;
            margin-bottom: 6px
        }

        .rpt .sum div {
            padding: 5px
        }

        .rpt .sum b {
            font-size: 16px
        }

        .rpt .sg {
            margin-top: 26px
        }

        .rpt .ft {
            margin-top: 10px
        }

        .rpt p {
            margin: 4px 0
        }

        .two {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 0 18px;
            align-items: start
        }

        .kv.k3 {
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr))
        }

        .pf {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px
        }

        .pf div {
            border: 1px solid #ddd;
            border-left: 3px solid var(--red);
            padding: 5px 8px
        }

        .pf span {
            display: block;
            font-size: 11px;
            color: #666
        }

        .reg table{font-size:11px;width:auto;min-width:100%}
        .reg th,.reg td{padding:4px 3px;text-align:center;border:1px solid var(--line);white-space:nowrap}
        .reg th small{font-weight:400;color:#bbb}.reg .l{text-align:left;padding:4px 8px}
        .reg .sun{background:rgba(214,40,40,.13)}.reg th.sun{background:#5a1414}
        .reg .gP{background:var(--yel);color:#111;font-weight:700}.reg .gA{background:var(--red);color:#fff;font-weight:700}.reg .gL{background:#111;color:#fff;font-weight:700}.reg .gN{color:#999}
        .reg .gf td{background:var(--bg);font-weight:700}
        @page reg{size:A4 landscape;margin:8mm}
        #pz .regp{page:reg}
        @page rcp{size:80mm 190mm;margin:3mm}
        #pz .rcp{page:rcp}
        @page {
            size: A4;
            margin: 12mm
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact
            }

            html,
            body {
                height: auto !important
            }

            body.pr {
                display: block;
                min-height: 0
            }

            body.pr {
                background: #fff !important
            }

            body.pr>*:not(#pz) {
                display: none !important
            }

            body.pr #pz {
                display: block;
                background: #fff;
                color: #111;
                --card: #fff;
                --ink: #111;
                --line: #ddd;
                --bg: #fff;
                --mut: #555
            }

            #pz .po {
                display: block
            }

            .np {
                display: none !important
            }

            .rpt {
                border: 0
            }
        }
        #lg{position:fixed;inset:0;z-index:99;background:#0a0a0a;display:flex;align-items:center;justify-content:center;padding:16px}
        #lg .lb{background:#fff;color:#111;border-radius:10px;border-top:6px solid var(--red);padding:26px;width:360px;max-width:100%}
        #lg h1{margin:0 0 2px;font-size:20px;letter-spacing:1px}#lg .lb p{margin:0 0 16px;color:#666;font-size:12px}
        #lg label{color:#444}#lg input{background:#fff;color:#111;margin-bottom:12px}#lge{color:#d62828;font-size:12px;margin:0 0 10px;min-height:14px}
        #sst{position:fixed;right:12px;bottom:12px;z-index:8;padding:5px 12px;border-radius:4px;font-size:12px;font-weight:700;background:#111;color:#ffc300;opacity:.92}
        aside{overflow-y:auto}
        .dsw{padding:0 4px 12px}
        .dsw label{color:#bbb;font-size:11px;text-transform:uppercase;letter-spacing:1px}
        .dsw select{background:#1c1c1c;color:#fff;border:1px solid var(--yel);font-weight:700}
        .nsep{color:#888;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:14px 12px 4px;border-top:1px solid #2a2a2a;margin-top:10px}
        @media(max-width:760px){.nsep{display:none}}
    </style>
</head>

<body>
    <aside>
        <div class="logo">THE CATALYST INSTITUTE<small id="dn">Computer Department</small></div>
        <div class="dsw"><label>Department</label><select id="dsel" onchange="setDept(this.value)"></select></div>
        <nav id="nav"></nav>
        <div style="padding:14px 12px;border-top:1px solid #2a2a2a;margin-top:10px;font-size:11px;color:#bbb"><span id="who"></span><br><button class="btn k s" style="margin-top:6px" onclick="logout()">Sign Out</button></div>
    </aside>
    <div class="mw">
        <div id="mbar" class="mbar np"></div>
        <main id="main"></main>
    </div>
    <div id="lg"><div class="lb"><h1>THE CATALYST INSTITUTE</h1><p>Management System - please sign in</p>
        <div id="lgl">Loading...</div>
        <form id="lgf" style="display:none"><label>Email</label><input id="lgm" type="email" required autocomplete="username"><label>Password</label><input id="lgp" type="password" required autocomplete="current-password"><div id="lge"></div><button class="btn" style="width:100%">Sign In</button></form></div></div>
    <div id="sst" class="np">Connecting...</div>
    <div id="modal">
        <div id="mbox"></div>
    </div>

            const m = merge3(base[k] || {}, split()[k], data.value || {}); if (!m) return false;
            if (k == 'inst') { root.gx = m.gx || []; root.ow = m.ow || [] } else root.depts[k] = m;
            ver[k] = data.version; base[k] = clone(data.value); norm(); return true
        }
        async function flushA() {
            const sp = split(), items = KEYS.filter(k => J(sp[k]) != snap[k]); if (!items.length) { setSt('All changes saved'); return }
            let merged = false;
            try {
                for (const k of items) {
                    let val = split()[k], tries = 0;
                    while (true) {
                        const v = ver[k], { data, error } = await sb.from('app_data').update({ value: val, version: v + 1, updated_at: new Date().toISOString(), updated_by: USER }).eq('key', k).eq('version', v).select('version');
                        if (error) throw error;
                        if (data && data.length) { ver[k] = data[0].version; snap[k] = J(val); base[k] = clone(val); break }
                        if (++tries > 3 || !(await mergeIn(k))) { await conflict(); return }
                        merged = true; val = split()[k]
                    }
                }
                setSt('All changes saved'); if (merged) softRefresh()
            } catch (e) { fail() }
        }
        const df = (b, c) => { if (!isO(c) || !isO(b)) return c; const o = {}; for (const k in c) if (J(c[k]) != J(b[k])) o[k] = df(b[k], c[k]); return o };
        async function flushT() {
            try {
                for (const k of DK) {
                    const d = root.depts[k], b = base[k] || {}, pa = df(b.a || {}, d.a || {}), pr = df(b.rp || {}, d.rp || {}), pt = df(b.tests || {}, d.tests || {});
                    if (!Object.keys(pa).length && !Object.keys(pr).length && !Object.keys(pt).length) continue;
                    const { data, error } = await sb.rpc('teacher_save', { p_key: k, p_a: pa, p_rp: pr, p_tests: pt }); if (error) throw error;
                    if (data == ver[k] + 1) ver[k] = data; base[k] = Object.assign(b, { a: clone(d.a), rp: clone(d.rp), tests: clone(d.tests) })
                }
                setSt('All changes saved')
            } catch (e) { fail() }
        }
        async function pullA() {
            const { data, error } = await sb.from('app_data').select('key,value,version'); if (error) throw error;
            const r = { cur: root.cur, cm: root.cm, gx: [], ow: [], depts: {} };
            data.forEach(x => { ver[x.key] = x.version; if (x.key == 'inst') { r.gx = (x.value || {}).gx || []; r.ow = (x.value || {}).ow || [] } else r.depts[x.key] = x.value || {} });
            root = r; norm(); const sp = split(); KEYS.forEach(k => { snap[k] = J(sp[k]); base[k] = JSON.parse(snap[k]) })
        }
        async function pullT() {
            const { data, error } = await sb.rpc('teacher_load'); if (error) throw error;
            const r = { cur: root.cur, cm: root.cm, gx: [], ow: [], depts: {} }, dd = data.d || {};
            for (const k in dd) { ver[k] = dd[k].version; r.depts[k] = dd[k].value || {} }
            ME = data.me || []; root = r; norm(); const sp = split(); DK.forEach(k => { snap[k] = J(sp[k]); base[k] = JSON.parse(snap[k]) })
        }
        const pull = () => isT() ? pullT() : pullA();
        function refresh() { CM = (root.cm && /^\d{4}-\d{2}$/.test(root.cm)) ? root.cm : mon(); deptSel(); go(CK) }
        function softRefresh() { if ((CK == 'att' && atab == 'm') || (CK == 'tst' && ttEd)) { deptSel(); bar() } else refresh() } /* never wipe a half-marked attendance sheet */
        async function conflict() {
            alert('Another user changed the same data at the same time. The latest data will be loaded now - please repeat your last entry.');
            await pull(); refresh(); setSt('Latest data loaded')
        }
        async function checkNew() {
            if (!USER) return; const ae = document.activeElement, typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.closest('form');
            if (busy || dirty || typing || $('#modal').style.display == 'flex') { clearTimeout(ck); ck = setTimeout(checkNew, 3000); return }
            try {
                let nw;
                if (isT()) { const { data } = await sb.rpc('teacher_versions'); nw = data && DK.some(k => ver[k] != data[k]) }
                else { const { data } = await sb.from('app_data').select('key,version'); nw = data && data.some(x => ver[x.key] != x.version) }
                if (nw) { await pull(); softRefresh(); setSt('Updated with latest data') }
            } catch (e) { }
        }
        function listen() {
            if (ch || isT()) return;
            ch = sb.channel('app_data_changes').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_data' }, () => checkNew()).subscribe()
        }
        document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNew() }); setInterval(checkNew, 15000);
        addEventListener('beforeunload', e => { if (busy || dirty) { e.preventDefault(); e.returnValue = '' } });
        function showLogin(msg) { USER = ''; ROLE = ''; $('#lg').style.display = 'flex'; $('#lgl').textContent = ''; $('#lgf').style.display = 'block'; $('#lge').textContent = msg || '' }
        async function enter(session) {
            USER = session.user.email; $('#lgl').textContent = 'Loading data...'; $('#lgf').style.display = 'none'; $('#lg').style.display = 'flex';
            try {
                const { data: rr, error: re } = await sb.from('user_roles').select('role,depts').maybeSingle(); if (re) throw re;
                if (!rr) { await sb.auth.signOut(); return showLogin('No role is assigned to this account yet. Please ask the Super Admin.') }
                ROLE = rr.role;
                if (isT() && rr.depts && rr.depts.length) { const keep = DK.filter(k => rr.depts.includes(k)); DK.length = 0; DK.push(...keep) }
                if (!DK.length) throw new Error('No department is assigned to this account.');
                await pull()
            } catch (e) { return showLogin('Could not load data: ' + e.message) }
            $('#who').textContent = USER + ' (' + RN[ROLE] + ')'; listen(); $('#lg').style.display = 'none';
            CM = (root.cm && /^\d{4}-\d{2}$/.test(root.cm)) ? root.cm : mon(); buildNav(); deptSel(); go(isT() ? 'my' : 'dash'); setSt('All changes saved')
        }
        $('#lgf').onsubmit = async e => {
            e.preventDefault(); $('#lge').textContent = '';
            const { data, error } = await sb.auth.signInWithPassword({ email: $('#lgm').value.trim(), password: $('#lgp').value });
            if (error) { $('#lge').textContent = error.message; return } enter(data.session)
        };
        async function logout() { if ((busy || dirty) && !confirm('Some changes are still saving. Sign out anyway?')) return; await sb.auth.signOut(); location.reload() }
        (async () => {
            try { const { data } = await sb.auth.getSession(); if (data.session) return enter(data.session) } catch (e) { }
            showLogin(''); setSt('Not signed in')
        })();
    </script>
</body>
